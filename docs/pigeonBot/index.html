<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>pigeonBot</title><style>
:root{--bg:#fbfaf7;--fg:#22262b;--mute:#5d6671;--line:#d9dde1;--ac:#2b6b6f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1f23;--fg:#e6e8ea;--mute:#98a1ab;--line:#33393f;--ac:#6fc0c4}}
*{box-sizing:border-box}html{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.85 "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:46rem;margin:0 auto;padding:3rem 1.25rem 4rem}
nav{display:flex;gap:1.25rem;font-size:.9rem;margin-bottom:2.5rem;padding-bottom:.75rem;border-bottom:1px solid var(--line)}
nav a{color:var(--mute);text-decoration:none}nav a[aria-current]{color:var(--fg);font-weight:700}
a{color:var(--ac)}a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h1{font-size:1.9rem;line-height:1.35;margin:0 0 .5rem}
h2{font-size:1.15rem;margin:2.5rem 0 .5rem;padding-left:.7rem;border-left:4px solid var(--ac)}
.meta{color:var(--mute);font-size:.9rem;margin:0 0 2rem}
ul,ol{padding-left:1.4rem}li{margin:.3rem 0}
footer{margin-top:3rem;padding-top:1rem;border-top:1px solid var(--line);color:var(--mute);font-size:.85rem}
button,.button{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:2.75rem;padding:.55rem 1.1rem;border:1px solid var(--ac);border-radius:.45rem;background:var(--ac);color:#fff;font:inherit;font-size:.95rem;font-weight:600;line-height:1.4;text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s,box-shadow .15s,transform .15s;-webkit-tap-highlight-color:transparent}button:hover,.button:hover{background:color-mix(in srgb,var(--ac) 85%,var(--fg));border-color:color-mix(in srgb,var(--ac) 85%,var(--fg))}button:active,.button:active{transform:translateY(1px)}button:focus-visible,.button:focus-visible{outline:2px solid var(--ac);outline-offset:3px}button:disabled,.button:disabled{opacity:.5;cursor:not-allowed;transform:none}button.secondary,.button.secondary{background:transparent;color:var(--ac)}button.secondary:hover,.button.secondary:hover{background:color-mix(in srgb,var(--ac) 10%,var(--bg))}button.danger,.button.danger{background:#b74343;border-color:#b74343;color:#fff}button.danger:hover,.button.danger:hover{background:#963535;border-color:#963535}
</style></head><body><main>
