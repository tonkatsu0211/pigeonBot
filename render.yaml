services:
  - type: worker
    name: pigeonbot
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install
    startCommand: node index.js
    autoDeployTrigger: commit
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      # 開発用サーバー限定でコマンドを登録したい場合のみ設定。本番では未設定のままにする。
      # - key: DISCORD_GUILD_ID
      #   sync: false
